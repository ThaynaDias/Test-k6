name: Testes de Performance com k6

# Define quando o pipeline vai rodar
on:
  # Roda automaticamente a cada push na branch master
  push:
    branches: [master]
  # Permite rodar manualmente pelo GitHub (botão Run workflow)
  workflow_dispatch:

# Jobs são os conjuntos de tarefas que vão rodar
jobs:
  teste-performance:
    # Nome que aparece no GitHub Actions
    name: Rodar k6

    # Tipo de máquina que vai rodar o pipeline
    # ubuntu-latest = Linux gratuito fornecido pelo GitHub
    runs-on: ubuntu-latest

    # Steps são os passos executados em ordem
    steps:

      # PASSO 1 — Baixa o código do repositório para a máquina
      # sem isso a máquina não teria acesso aos seus arquivos
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      # PASSO 2 — Instala o k6 na máquina Linux
      # curl baixa o arquivo compactado do k6
      # tar extrai o arquivo
      # cp copia o executável para uma pasta do sistema
      - name: 🔧 Instalar k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz -L | tar xvz
          sudo cp k6-v0.55.0-linux-amd64/k6 /usr/local/bin/k6

      # PASSO 3 — Roda os testes de performance
      # se algum threshold falhar, o pipeline para e mostra ❌
      # se tudo passar, mostra ✅
      - name: 🚀 Executar todos os testes
        run: |
          # encontra todos os arquivos .js e roda um por um
          find tests/ -name "*.js" | while read file; do
            echo "▶️ Rodando: $file"
            k6 run "$file"
          done